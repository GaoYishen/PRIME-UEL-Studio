<h1>PRIME UEL Studio</h1>
<p>从 Abaqus/CAE 的当前模型打开 PRIME UEL Studio。插件会读取模型、零件、装配实例、作业、分析步和当前视口，桌面窗口继续完成参数、初态和文件步骤。</p>
<p>在“PRIME UEL Studio”子菜单中可以选择 T3 反应边或 H8 反应面。开始后先在当前视口选择固相单元，再选择液相单元，Studio 会自动导出当前模型的 INP 副本并识别两相之间的所有相邻界面。生成过程始终写入新的 INP 副本，不改原模型。</p>
